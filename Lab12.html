<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting and Calculator</title>
</head>

<body>

    <div class="container">

        <h1>Greeting and Calculator</h1>

        <h2>Enter Your Name</h2>

        <input type="text" id="name" placeholder="Enter your name">

        <br>

        <button id="greetButton">Greet Me</button>

        <p id="greeting"></p>

        <hr>

        <h2>Simple Calculator</h2>

        <input type="number" id="num1" placeholder="First Number">

        <br>

        <input type="number" id="num2" placeholder="Second Number">

        <h3>Select an Operation</h3>

        <div class="operations">

            <input type="radio" name="operation" value="add" id="add">
            <label for="add">Addition</label>

            <br>

            <input type="radio" name="operation" value="subtract" id="subtract">
            <label for="subtract">Subtraction</label>

            <br>

            <input type="radio" name="operation" value="multiply" id="multiply">
            <label for="multiply">Multiplication</label>

            <br>

            <input type="radio" name="operation" value="divide" id="divide">
            <label for="divide">Division</label>

        </div>

        <button id="calculateButton">Calculate</button>

        <p id="result"></p>

        <hr>

        <button id="clearButton">Clear / Start Again</button>

    </div>

    <script>

        const greetButton = document.getElementById('greetButton');
        const calculateButton = document.getElementById('calculateButton');
        const clearButton = document.getElementById('clearButton');

        greetButton.addEventListener('click', greetUser);
        calculateButton.addEventListener('click', calculate);
        clearButton.addEventListener('click', clearScreen);


        function greetUser() {

            const name = document.getElementById('name');
            const greeting = document.getElementById('greeting');

            if (name.value === "") {
                greeting.innerText = "Please enter your name.";
            } else {
                greeting.innerText = "Hello, " + name.value + "!";
            }

        }

        function calculate() {

            const num1 = document.getElementById('num1');
            const num2 = document.getElementById('num2');
            const result = document.getElementById('result');

            const add = document.getElementById('add');
            const subtract = document.getElementById('subtract');
            const multiply = document.getElementById('multiply');
            const divide = document.getElementById('divide');

            if (num1.value === "" || num2.value === "") {
                result.innerText = "Please enter both numbers.";
                return;
            }

            let first = Number(num1.value);
            let second = Number(num2.value);
            let answer;

            if (add.checked) {
                answer = first + second;

            } else if (subtract.checked) {
                answer = first - second;

            } else if (multiply.checked) {
                answer = first * second;

            } else if (divide.checked) {

                if (second === 0) {
                    result.innerText = "Cannot divide by zero.";
                    return;
                }

                answer = first / second;

            } else {
                result.innerText = "Please select an operation.";
                return;
            }

            result.innerText = "Result: " + answer;

        }


        function clearScreen() {

            const name = document.getElementById('name');
            const num1 = document.getElementById('num1');
            const num2 = document.getElementById('num2');

            const greeting = document.getElementById('greeting');
            const result = document.getElementById('result');

            const add = document.getElementById('add');
            const subtract = document.getElementById('subtract');
            const multiply = document.getElementById('multiply');
            const divide = document.getElementById('divide');

            name.value = "";
            num1.value = "";
            num2.value = "";

            greeting.innerText = "";
            result.innerText = "";


        }

    </script>

</body>
</html>
