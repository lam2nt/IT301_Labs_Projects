<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Images</title>

    <style>
        #images {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        #image1{
            width: 200px;
            height: 200px;
        }
        #image2{
            width: 300px;
            height: 300px;
        }
        #image3 {
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>

    <div id="images">
        <img id="image1" src="https://picsum.photos/200/200?random=1" alt="Random image 1">
        <img id="image2" src="https://picsum.photos/300/300?random=2" alt="Random image 2">
        <img id="image3" src="https://picsum.photos/200/200?random=3" alt="Random image 3">
    </div>

</body>
</html>
