<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masonry</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        body {
            display: flex;
        }


        #leftPanel {
            width: 80px;
            flex: 0 0 80px;
            height: 100vh;

            background-color: orange;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;

            padding-top: 25px;
            padding-bottom: 25px;
        }

        #leftPanel p {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 30px;

            font-size: 28px;
        }

        #trashIcon {
            font-size: 28px;
        }
        #rightPanel {
            flex: 1;

            height: 100vh;

            overflow-y: auto;
            overflow-x: hidden;

            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: flex-start;
        }
        #rightPanel img {
            height: 100px;
            width: auto;

            flex-grow: 1;
            flex-shrink: 1;

            object-fit: cover;

            display: block;

            border: 2px white solid;
        }
    </style>
</head>

<body>

    <div id="leftPanel">

        <p>
            <span>&#x1F4F7;</span>
            <span>&#x1F5BC;&#xFE0F;</span>
            <span>&#x2764;&#xFE0F;</span>
        </p>

        <div id="trashIcon">
            &#x1F5D1;&#xFE0F;
        </div>

    </div>
